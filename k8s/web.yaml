apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: booking
spec:
  selector:
    app: web
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: booking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: booking-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: INTERNAL_API_URL
              value: http://api:3001
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi