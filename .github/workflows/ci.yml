name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_app_test
      JWT_SECRET: ci_test_secret

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - run: npm test

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build API image
        run: docker build -t booking-api ./backend

      - name: Build web image
        run: docker build -t booking-web --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001 ./frontend

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit backend dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend

      - name: Audit frontend dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  publish-images:
    needs: [backend-tests, docker-build, security-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push API image
        run: |
          IMAGE=ghcr.io/lynda-hamadi/booking-api
          docker build \
            --label org.opencontainers.image.source=https://github.com/Lynda-hamadi/booking-app \
            -t $IMAGE:${{ github.sha }} -t $IMAGE:latest ./backend
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Build and push web image
        run: |
          IMAGE=ghcr.io/lynda-hamadi/booking-web
          docker build \
            --label org.opencontainers.image.source=https://github.com/Lynda-hamadi/booking-app \
            --build-arg NEXT_PUBLIC_API_URL=https://booking-app-api-zq0j.onrender.com \
            -t $IMAGE:${{ github.sha }} -t $IMAGE:latest ./frontend
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest